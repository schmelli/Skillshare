services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillshare
      POSTGRES_PASSWORD: skillshare
      POSTGRES_DB: skillshare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillshare -d skillshare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
